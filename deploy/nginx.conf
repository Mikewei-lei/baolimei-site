# 葆历莓 baolimei.cn —— 主机 Nginx 反向代理配置
# 放置到 /etc/nginx/conf.d/baolimei.conf
# 首次部署先用 80 端口跑通，再执行 certbot 自动加 443

upstream baolimei_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name baolimei.cn www.baolimei.cn;

    # certbot 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 24m;

    location / {
        return 301 https://baolimei.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.baolimei.cn;

    # 证书路径按 certbot 生成的实际文件名填写
    ssl_certificate     /etc/letsencrypt/live/baolimei.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baolimei.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://baolimei.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name baolimei.cn;

    ssl_certificate     /etc/letsencrypt/live/baolimei.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baolimei.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    client_max_body_size 24m;

    # Next 静态资源长缓存
    location /_next/static/ {
        proxy_pass http://baolimei_app;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /brand/ {
        proxy_pass http://baolimei_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://baolimei_app;
    }
}

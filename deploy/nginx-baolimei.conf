# baolimei.cn — 葆历莓（手工维护，由宝塔 nginx 的 /www/server/panel/vhost/nginx/*.conf 引入）
limit_req_zone $binary_remote_addr zone=blm_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name baolimei.cn www.baolimei.cn;

    root /www/wwwroot/baolimei.cn;
    client_max_body_size 24m;
    server_tokens off;
    proxy_cache off;
    limit_req_status 429;

    location ~ /\.(?!well-known) { deny all; }

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/baolimei.cn;
        default_type text/plain;
    }

    location = /api/generate {
        limit_req zone=blm_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache off;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache off;
        expires 365d;
    }

    location ^~ /brand/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache off;
    }
}

